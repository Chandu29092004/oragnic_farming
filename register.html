<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Organic Farming Management System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                linear-gradient(rgba(0, 70, 0, 0.55), rgba(0, 70, 0, 0.55)),
                url("https://images.unsplash.com/photo-1500937386664-56d1dfef3854?auto=format&fit=crop&w=1600&q=80");

            background-size: cover;
            background-position: center;

            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        /* Register Box */
        .register-container {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 35px 40px;
            border-radius: 15px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.3);
        }

        /* Logo */
        .logo {
            text-align: center;
            color: #1b5e20;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .logo span {
            color: #66bb6a;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        /* Form */
        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;
            color: #2e7d32;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #43a047;
            box-shadow: 0 0 5px rgba(67, 160, 71, 0.25);
        }

        /* Two columns */
        .row {
            display: flex;
            gap: 15px;
        }

        .row .form-group {
            width: 50%;
        }

        /* Terms */
        .terms {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin: 10px 0 20px;
            font-size: 13px;
            color: #666;
        }

        .terms input {
            margin-top: 3px;
        }

        .terms a {
            color: #2e7d32;
            text-decoration: none;
        }

        /* Register Button */
        .register-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background-color: #2e7d32;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .register-btn:hover {
            background-color: #1b5e20;
        }

        /* Login */
        .login-text {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }

        .login-text a {
            color: #2e7d32;
            font-weight: bold;
            text-decoration: none;
        }

        .login-text a:hover {
            text-decoration: underline;
        }

        /* Home */
        .home-link {
            text-align: center;
            margin-top: 15px;
        }

        .home-link a {
            text-decoration: none;
            color: #555;
            font-size: 14px;
        }

        .home-link a:hover {
            color: #2e7d32;
        }

        /* Responsive */
        @media (max-width: 550px) {

            .register-container {
                padding: 30px 20px;
            }

            .row {
                flex-direction: column;
                gap: 0;
            }

            .row .form-group {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="register-container">

        <!-- Logo -->
        <div class="logo">
            🌱 Organic<span>Farm</span>
        </div>

        <p class="subtitle">
            Create your account
        </p>

        <!-- Registration Form -->
        <form id="registerForm" action="register.php" method="POST">


            <!-- Full Name -->
            <div class="form-group">
                <label for="name">Full Name</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required>
            </div>


            <!-- Email & Phone -->
            <div class="row">

                <div class="form-group">
                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter email"
                        required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone</label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Phone number"
                        pattern="[0-9]{10}"
                        required>
                </div>

            </div>


            <!-- User Type -->
            <div class="form-group">

                <label for="role">Register As</label>

                <select id="role" name="role" required>

                    <option value="">
                        Select User Type
                    </option>

                    <option value="farmer">
                        👨‍🌾 Farmer
                    </option>

                    <option value="customer">
                        🛒 Customer
                    </option>

                </select>

            </div>


            <!-- Location -->
            <div class="form-group">

                <label for="location">Location</label>

                <input
                    type="text"
                    id="location"
                    name="location"
                    placeholder="Enter your village/city"
                    required>

            </div>


            <!-- Password -->
            <div class="form-group">

                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    minlength="6"
                    required>

            </div>


            <!-- Confirm Password -->
            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Confirm your password"
                    minlength="6"
                    required>

            </div>


            <!-- Terms -->
            <div class="terms">

                <input
                    type="checkbox"
                    id="terms"
                    required>

                <label for="terms">
                    I agree to the
                    <a href="#">Terms & Conditions</a>
                    and Privacy Policy.
                </label>

            </div>


            <!-- Register Button -->
            <button
                type="submit"
                class="register-btn">

                Create Account

            </button>

        </form>


        <!-- Login -->
        <div class="login-text">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>


        <!-- Home -->
        <div class="home-link">

            <a href="index.html">
                ← Back to Home
            </a>

        </div>

    </div>


    <!-- JavaScript Validation -->
    <script>

        document
            .getElementById("registerForm")
            .addEventListener("submit", function(event) {


                let password =
                    document.getElementById("password").value;

                let confirmPassword =
                    document.getElementById("confirmPassword").value;

                if (password !== confirmPassword) {
                    event.preventDefault();

                    alert("Passwords do not match!");

                    return;
                }

                alert(
                    "Registration successful! Welcome to OrganicFarm."
                );

                // After connecting PHP/MySQL,
                // replace this with:
                // window.location.href = "login.html";

            });

    </script>

</body>
</html>
