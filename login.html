<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Organic Farming Management System</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            background:
                linear-gradient(
                    rgba(0, 70, 0, 0.55),
                    rgba(0, 70, 0, 0.55)
                ),
                url("https://images.unsplash.com/photo-1500937386664-56d1dfef3854?auto=format&fit=crop&w=1600&q=80");

            background-size: cover;
            background-position: center;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        /* Login Box */

        .login-container {

            width: 100%;
            max-width: 430px;

            background: white;

            padding: 40px;

            border-radius: 15px;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.3);
        }

        /* Logo */

        .logo {

            text-align: center;

            color: #1b5e20;

            font-size: 28px;

            font-weight: bold;

            margin-bottom: 8px;
        }

        .logo span {
            color: #66bb6a;
        }

        .subtitle {

            text-align: center;

            color: #777;

            margin-bottom: 30px;
        }

        /* Form */

        .form-group {

            margin-bottom: 20px;
        }

        .form-group label {

            display: block;

            color: #2e7d32;

            font-weight: bold;

            margin-bottom: 8px;
        }

        .form-group input,
        .form-group select {

            width: 100%;

            padding: 13px;

            border: 1px solid #ccc;

            border-radius: 7px;

            font-size: 15px;

            outline: none;

            transition: 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {

            border-color: #43a047;

            box-shadow:
                0 0 5px rgba(67, 160, 71, 0.25);
        }

        /* Password */

        .password-box {

            position: relative;
        }

        .password-box input {

            padding-right: 70px;
        }

        .show-password {

            position: absolute;

            right: 12px;

            top: 50%;

            transform: translateY(-50%);

            border: none;

            background: none;

            color: #2e7d32;

            cursor: pointer;

            font-weight: bold;
        }

        /* Remember / Forgot */

        .options {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 25px;

            font-size: 14px;
        }

        .remember {

            display: flex;

            align-items: center;

            gap: 7px;

            color: #666;
        }

        .options a {

            color: #2e7d32;

            text-decoration: none;

            font-weight: bold;
        }

        .options a:hover {

            text-decoration: underline;
        }

        /* Login Button */

        .login-btn {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 7px;

            background-color: #2e7d32;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .login-btn:hover {

            background-color: #1b5e20;
        }

        /* Register */

        .register-text {

            text-align: center;

            margin-top: 22px;

            color: #666;

            font-size: 14px;
        }

        .register-text a {

            color: #2e7d32;

            font-weight: bold;

            text-decoration: none;
        }

        .register-text a:hover {

            text-decoration: underline;
        }

        /* Home */

        .home-link {

            text-align: center;

            margin-top: 18px;
        }

        .home-link a {

            text-decoration: none;

            color: #555;

            font-size: 14px;
        }

        .home-link a:hover {

            color: #2e7d32;
        }

        /* Responsive */

        @media (max-width: 500px) {

            .login-container {

                padding: 30px 22px;
            }

            .options {

                flex-direction: column;

                align-items: flex-start;

                gap: 12px;
            }
        }

    </style>

</head>


<body>


    <!-- Login Container -->

    <div class="login-container">


        <!-- Logo -->

        <div class="logo">

            🌱 Organic<span>Farm</span>

        </div>


        <p class="subtitle">

            Login to your account

        </p>


        <!-- Login Form -->

        <form id="loginForm" action="login.php" method="POST">


            <!-- User Type -->

            <div class="form-group">

                <label for="role">

                    Login As

                </label>

                <select
                    id="role"
                    name="role"
                    required>

                    <option value="">

                        Select User Type

                    </option>

                    <option value="farmer">

                        👨‍🌾 Farmer

                    </option>

                    <option value="customer">

                        🛒 Customer

                    </option>

                    <option value="admin">

                        👨‍💼 Admin

                    </option>

                </select>

            </div>


            <!-- Email -->

            <div class="form-group">

                <label for="email">

                    Email Address

                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required>

            </div>


            <!-- Password -->

            <div class="form-group">

                <label for="password">

                    Password

                </label>


                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required>

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword()">

                        Show

                    </button>

                </div>

            </div>


            <!-- Remember / Forgot -->

            <div class="options">

                <label class="remember">

                    <input
                        type="checkbox"
                        id="remember">

                    Remember me

                </label>


                <a href="#">

                    Forgot Password?

                </a>

            </div>


            <!-- Login Button -->

            <button
                type="submit"
                class="login-btn">

                Login

            </button>


        </form>


        <!-- Register -->

        <div class="register-text">

            Don't have an account?

            <a href="register.html">

                Create Account

            </a>

        </div>


        <!-- Home -->

        <div class="home-link">

            <a href="index.html">

                ← Back to Home

            </a>

        </div>


    </div>


    <!-- JavaScript -->

    <script>

function togglePassword() {

    const password = document.getElementById("password");
    const button = document.querySelector(".show-password");

    if (password.type === "password") {
        password.type = "text";
        button.textContent = "Hide";
    } else {
        password.type = "password";
        button.textContent = "Show";
    }

}


document
    .getElementById("loginForm")
    .addEventListener("submit", function(event) {

        const role =
            document.getElementById("role").value;

        const email =
            document.getElementById("email").value;

        const password =
            document.getElementById("password").value;

        if (role === "" || email === "" || password === "") {

            event.preventDefault();

            alert("Please fill in all fields.");

            return;
        }

    });

</script>

        
</body>

</html>
